<header class="site-header" (keydown.escape)="closeMobileMenu()">
  <div class="header-inner page-container">
    <a class="brand" routerLink="/" aria-label="DealFinder home" (click)="closeMobileMenu()">
      <span class="brand-mark" aria-hidden="true">D</span>
      <span>Deal<span class="brand-accent">Finder</span></span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      [attr.aria-expanded]="mobileMenuOpen"
      aria-controls="primary-navigation"
      [attr.aria-label]="mobileMenuOpen ? 'Close navigation' : 'Open navigation'"
      (click)="toggleMobileMenu()"
    >
      <span></span><span></span><span></span>
    </button>

    <button
      *ngIf="mobileMenuOpen"
      class="menu-backdrop"
      type="button"
      aria-label="Close navigation"
      (click)="closeMobileMenu()"
    ></button>

    <nav id="primary-navigation" class="primary-nav" [class.is-open]="mobileMenuOpen" aria-label="Main navigation">
      <a routerLink="/" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMobileMenu()">Home</a>
      <a routerLink="/products" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMobileMenu()">Products</a>
      <a routerLink="/deals" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMobileMenu()">Deals</a>
      <a routerLink="/coupons" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMobileMenu()">Coupons</a>
      <a routerLink="/categories" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMobileMenu()">Categories</a>
    </nav>

    <a class="header-cta" routerLink="/products" (click)="closeMobileMenu()">Explore deals <span aria-hidden="true">↗</span></a>
  </div>
</header>
